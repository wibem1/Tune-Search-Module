<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tune Search v0.2.0</title>
<style>:root{font-family:system-ui,-apple-system,sans-serif;color:#202124;background:#eef1f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #c9ced4;padding:13px 18px;display:flex;justify-content:space-between}main{max-width:1050px;margin:auto;padding:16px}.panel,.hit{background:#fff;border:1px solid #c9ced4;border-radius:10px;padding:16px;margin-bottom:12px}.search,.filters,.actions,.listbar{display:flex;gap:8px;flex-wrap:wrap}.search input{flex:1;min-width:220px}input,select{padding:10px;border:1px solid #9aa0a6;border-radius:7px;font:inherit}button{padding:9px 13px;border:1px solid #9aa0a6;border-radius:7px;background:#f8f9fa;font:inherit}.filters{margin-top:10px}.filters input{width:150px}.status,.meta{color:#5f6368;font-size:13px}#results{display:grid;gap:10px}.hit h3{margin:0 0 5px}.actions{margin-top:10px}.preview{margin-top:10px;overflow-x:auto}.lists{margin-top:10px}.saved{padding:8px 0;border-top:1px solid #ddd}.saved:first-child{border-top:0}</style>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.5.2/dist/abcjs-basic-min.js"></script></head><body><header><strong>Tune Search</strong><span class="status">Test-WebApp · v0.2.0</span></header><main>
<section class="panel"><div class="search"><input id="query" placeholder="Titel enthält …"><button id="search">Suchen</button></div><div class="filters"><input id="type" placeholder="Typ, z. B. reel"><input id="key" placeholder="Tonart, z. B. D"><input id="meter" placeholder="Takt, z. B. 4/4"><button id="clear">Filter leeren</button></div><p id="status" class="status">ABC-Tools-Datenquelle: The Session.</p></section>
<section class="panel"><strong>Suchlisten</strong><div class="listbar"><input id="newList" placeholder="Neue Liste"><button id="createList">Liste anlegen</button><select id="listSelect"></select><button id="exportList">Liste speichern</button><label><input id="importFile" type="file" accept=".json,application/json" hidden><button id="importButton" type="button">Liste laden</button></label></div><div id="saved" class="lists"></div></section>
<div id="results"></div></main><script type="module" src="./src/test-app.js?v=0.2.0"></script></body></html>
